name: E2E

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar el stack E2E aislado (docker compose + seed)
        run: npm run e2e:up

      - name: Suite Playwright (5 flujos)
        run: npm run test:e2e

      - name: Derribar el stack E2E
        if: always()
        run: npm run e2e:down

      - name: Subir traces y reporte en fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
