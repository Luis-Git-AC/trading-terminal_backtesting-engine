name: trading-terminal

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt
      POSTGRES_DB: trading_terminal
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tt -d trading_terminal']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tt-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # La ingesta en un contenedor: con restart: unless-stopped vuelve sola tras un reinicio del
  # portatil, igual que postgres y redis. La imagen es la misma que usa el stack de e2e (el
  # fuente del backend ejecutado con tsx), asi que no hay un segundo Dockerfile que mantener.
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: trading-terminal-backend:latest
    container_name: tt-ingestor
    restart: unless-stopped
    command: ['npx', 'tsx', 'backend/src/main.ts', 'ingestor']
    env_file: .env
    environment:
      START_MODE: ingestor
      # Dentro de la red de compose los servicios se llaman por su nombre, no por localhost.
      DATABASE_URL: postgres://tt:tt@postgres:5432/trading_terminal
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # El collector trae lo que no viene por WebSocket (funding, OI y, desde F9-T3, macro) con jobs
  # repeatable de BullMQ. Mismo artefacto y misma imagen que el ingestor: solo cambia el rol.
  collector:
    # Mismo build que el ingestor a proposito: sin el, `docker compose build` no refresca este
    # servicio y se queda con una imagen vieja sin darse cuenta.
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: trading-terminal-backend:latest
    container_name: tt-collector
    restart: unless-stopped
    command: ['npx', 'tsx', 'backend/src/main.ts', 'collector']
    env_file: .env
    environment:
      START_MODE: collector
      DATABASE_URL: postgres://tt:tt@postgres:5432/trading_terminal
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestor:
        condition: service_started

  # El cerebro: trocea los documentos crudos y calcula sus embeddings en local, sin coste y sin
  # salir del portatil. El modelo se cachea en el volumen `hfcache` montado como HF_HOME: sin el,
  # cada arranque del contenedor volveria a descargarlo y dependeria de la red para funcionar.
  brain:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: trading-terminal-backend:latest
    container_name: tt-brain
    restart: unless-stopped
    command: ['npx', 'tsx', 'backend/src/main.ts', 'brain']
    env_file: .env
    environment:
      START_MODE: brain
      DATABASE_URL: postgres://tt:tt@postgres:5432/trading_terminal
      REDIS_URL: redis://redis:6379
      HF_HOME: /cache/huggingface
      # Dentro del contenedor la ruta es fija; lo que cambia es que carpeta del host se monta.
      OBSIDIAN_VAULT_PATH: /vault
    volumes:
      - hfcache:/cache/huggingface
      # El vault del usuario. Sin `OBSIDIAN_VAULT_PATH` en el `.env` se monta una carpeta local
      # del repositorio (ignorada por git), asi que el servicio arranca igual sin decidir nada.
      - ${OBSIDIAN_VAULT_PATH:-./.obsidian-vault}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  hfcache:
